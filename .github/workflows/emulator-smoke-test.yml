name: Emulator smoke test

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download the APK built by "Build Android APK"
        uses: actions/download-artifact@v4
        with:
          name: addis-surfers-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || '' }}
        continue-on-error: true

      - name: Fall back to the published APK
        run: |
          if [ ! -f addis-surfers.apk ]; then
            curl -sSfL -o addis-surfers.apk \
              https://github.com/${{ github.repository }}/releases/download/apk-latest/addis-surfers.apk
          fi
          ls -la addis-surfers.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r addis-surfers.apk
            adb logcat -c
            adb shell am start -W -n com.addissurfers.addis_surfers/.MainActivity
            sleep 25
            adb exec-out screencap -p > screenshot.png || true
            adb logcat -d > logcat.txt || true
            echo "===== process ====="; adb shell pidof com.addissurfers.addis_surfers || echo "APP NOT RUNNING"
            echo "===== crash buffer ====="; adb logcat -d -b crash || true
            echo "===== errors ====="; grep -E " E |FATAL|AndroidRuntime|flutter|DEBUG  " logcat.txt | grep -v -E "chatty|GoogleApiManager" | tail -200 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-output
          path: |
            screenshot.png
            logcat.txt
