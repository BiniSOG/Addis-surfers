name: Emulator smoke test

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download the APK built by "Build Android APK"
        uses: actions/download-artifact@v4
        with:
          name: addis-surfers-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || '' }}
        continue-on-error: true

      - name: Fall back to the published APK
        run: |
          if [ ! -f addis-surfers.apk ]; then
            curl -sSfL -o addis-surfers.apk \
              https://github.com/${{ github.repository }}/releases/download/apk-latest/addis-surfers.apk
          fi
          ls -la addis-surfers.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r addis-surfers.apk
            adb logcat -c
            adb shell am start -W -n com.addissurfers.addis_surfers/.MainActivity
            sleep 20
            adb exec-out screencap -p > menu.png || true
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell wm size
            S=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1); W=${S%x*}; H=${S#*x}; echo "screen $W x $H"; adb shell input tap $((W/2)) $((H*84/100)); sleep 3; adb shell input swipe $((W/2)) $((H*70/100)) $((W/2)) $((H*45/100)) 120; sleep 1; adb shell input swipe $((W/2)) $((H*50/100)) $((W*80/100)) $((H*50/100)) 120; sleep 1; adb shell input swipe $((W/2)) $((H*45/100)) $((W/2)) $((H*70/100)) 120; sleep 6
            adb exec-out screencap -p > run.png || true
            adb logcat -d > logcat.txt || true
            echo "===== crash buffer ====="; adb logcat -d -b crash || true
            echo "===== app log ====="; grep -E "AndroidRuntime|flutter|MediaPlayer.*rror|AudioTrack.*rror" logcat.txt | tail -150 || true
            echo "===== audio ====="; grep "AddisAudio" logcat.txt || true
            if grep -E "Audio init failed|Music switch failed|SFX error|Vibration error|could not load" logcat.txt; then echo "AUDIO/HAPTICS ERRORS FOUND"; exit 1; fi
            if ! grep -q "AddisAudio: music started" logcat.txt; then echo "MUSIC NEVER STARTED"; exit 1; fi
            if adb shell pidof com.addissurfers.addis_surfers; then echo "APP IS RUNNING"; else echo "APP NOT RUNNING"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-output
          path: |
            menu.png
            run.png
            logcat.txt
